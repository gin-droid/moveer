name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura GitHub Pages per Actions
        uses: actions/configure-pages@v5

      - name: Associa il sottodominio app.moveer.eu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          response_file="${RUNNER_TEMP}/pages-response.json"
          status_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"cname":"app.moveer.eu","build_type":"workflow","https_enforced":true}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "GitHub Pages API HTTP ${status_code}"
          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            jq -r '.message // "GitHub Pages configuration failed"' "$response_file"
            exit 1
          fi

      - name: Verifica build PWA generata localmente
        run: |
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/sw.js
          test -s dist/moveerai-icon-192.png
          test -s dist/moveerai-icon-512.png

      - name: Fallback per le route SPA
        run: cp dist/index.html dist/404.html

      - name: Carica artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4