# R8 Advanced Optimization Rules for moVeerAI
# File: r8-optimization.properties
# Usage: These flags can be passed to R8 for additional optimization
# Add to gradle.properties or build.gradle

# =============================================================================
# VERSION CONFIGURATION
# =============================================================================
# Current Version: 1.8
# Version Code: 10
# Previous Version: 1.7 (versionCode 9)

# =============================================================================
# R8 OPTIMIZATION FLAGS (Advanced)
# =============================================================================

# R8 optimization level (0 = NONE, 3 = AGGRESSIVE - default is 2)
# R8 uses a simpler model, but we can enable more aggressive optimizations
android.enableR8=true
android.optimizeR8=true

# Enable class merging to reduce dex method count
# This helps avoid the 64K method limit
android.enableD8HybridDexing=true

# Enable incremental desugaring for Java 8+ features
android.enableIncrementalDesugaring=true

# Enable resource shrinking (requires buildToolsVersion >= 26)
android.enableResourceProcessing=true

# Shrink resources aggressively
android.resources.shrink=true

# Strip all debug information from release builds
android.debuggable=false

# Enable code shrinking for unused resources
android.enableAapt2=true

# Optimize for smaller APK/AAB size
# Note: R8 doesn't have direct equivalent to ProGuard's -dontobfuscate
# but we can use these settings

# Use kotlin compiler options for smaller output
kotlin.options.jvmTarget=21
kotlin.options.freeCompilerArgs=+release

# Enable code caching for faster builds
org.gradle.caching=true

# Enable parallel compilation
org.gradle.parallel=true

# Use Daemon for faster builds
org.gradle.daemon=true

# Configure memory for large builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# =============================================================================
# ADDITIONAL R8 RULES
# =============================================================================

# Don't mix multiple dex files (for smaller output)
android.enableR8.fullMode=true

# Optimize for startup time and memory usage
# These help with app performance on low-end devices