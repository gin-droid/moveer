# moVeerAI - Build Configuration for Google Play Console Upload
# File: build.properties
# Usage: This file tracks build metadata for Play Console uploads
# DO NOT commit to version control if it contains sensitive data

# =============================================================================
# APP METADATA
# =============================================================================
APP_NAME=moVeerAI
ANDROID_PACKAGE_NAME=com.moveer.myapp
IOS_BUNDLE_ID=com.moveerai.app
APP_VERSION_NAME=1.9
APP_VERSION_CODE=11  # già usato per upload precedente
PREV_APP_VERSION_NAME=1.8
PREV_APP_VERSION_CODE=10  # usato per upload precedente
ANDROID_MIN_SDK_VERSION=24
ANDROID_TARGET_SDK_VERSION=36
ANDROID_COMPILE_SDK_VERSION=36

# =============================================================================
# GOOGLE PLAY PRODUCTS (Must match Play Console)
# =============================================================================
PRODUCT_PRO_MONTHLY=pro-monthly
PRODUCT_PRO_ANNUAL=pro-annual
PRODUCT_COACH_MONTHLY=coach-monthly
PRODUCT_COACH_ANNUAL=coach-annual

# =============================================================================
# BUILD ARTIFACTS
# =============================================================================
BUILD_OUTPUT_DIR=android/app/build/outputs/bundle/release
BUILD_OUTPUT_FILE=app-release.aab
BUILD_TYPE=release
BUILD_TOOLS_VERSION=8.13.0

# =============================================================================
# SIGNING (Environment Variables)
# =============================================================================
# These values should be set as env vars, not in this file
# STORE_FILE env: MOVEER_UPLOAD_STORE_FILE
# STORE_PASSWORD env: MOVEER_UPLOAD_STORE_PASSWORD
# KEY_ALIAS env: MOVEER_UPLOAD_KEY_ALIAS
# KEY_PASSWORD env: MOVEER_UPLOAD_KEY_PASSWORD

# Keystore path (update with your actual keystore location)
# KEYSTORE_PATH=/Users/gianluca/.android/moveerai-upload-2026.p12
# KEY_ALIAS=moveer-upload

# =============================================================================
# PLAY CONSOLE NOTES
# =============================================================================
# 1. applicationId must be: com.moveer.myapp
# 2. Upload key certificate SHA-256: BE:18:D0:A3:39:D9:B6:EE:2C:41:8E:CE:54:37:62:8C:22:8A:32:77:C5:78:51:E7:A1:F5:27:38:E7:E2:3B:02
# 3. Product IDs in Play Console must match PRODUCT_* constants above
# 4. Increment versionCode for each new upload - CURRENT: 10

# =============================================================================
# LAST BUILD INFO
# =============================================================================
LAST_BUILD_TIMESTAMP=2024-11-24
LAST_BUILD_COMMAND=npm run build && npm run cap:sync:android && cd android && ./gradlew bundleRelease