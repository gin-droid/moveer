<style>
:root{
  --bg:#0a0a0a; --card:#161616; --border:#262626; --fg:#fafafa;
  --muted:#a1a1aa; --primary:#a3e635; --primary-fg:#0a0a0a;
  --rose:#fb7185; --amber:#fbbf24; --emerald:#34d399;
  --radius:0.75rem; --font:'Inter',system-ui,sans-serif; --display:'Oswald','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,0.85);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:1rem 1.25rem}
.header-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:0.75rem}
.logo{width:38px;height:38px;border-radius:12px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary-fg);font-size:1.1rem;font-family:var(--display)}
.brand{font-family:var(--display);font-weight:600;letter-spacing:-0.02em;font-size:1.15rem}
.tag{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.18em;margin-left:0.4rem}
.controls{max-width:700px;margin:0 auto;padding:1rem 1.25rem 0;display:flex;flex-direction:column;gap:0.75rem}
.tabs{display:flex;gap:0.4rem;flex-wrap:wrap}
.tab{padding:0.45rem 0.85rem;border-radius:0.6rem;font-size:0.82rem;font-weight:500;
  border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all 0.15s}
.tab.active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tab:hover:not(.active){color:var(--fg)}
.tab .count{opacity:0.6;font-size:0.72rem;margin-left:0.2rem}
.filters{display:flex;gap:0.5rem;flex-wrap:wrap}
.search{flex:1;min-width:160px;background:var(--card);border:1px solid var(--border);
  border-radius:0.6rem;padding:0.55rem 0.9rem;color:var(--fg);font-size:0.88rem;outline:none}
.search:focus{border-color:var(--primary)}
.search::placeholder{color:#52525b}
select{background:var(--card);border:1px solid var(--border);border-radius:0.6rem;
  padding:0.55rem 0.8rem;color:var(--fg);font-size:0.82rem;outline:none;cursor:pointer}
select:focus{border-color:var(--primary)}
.result-count{font-size:0.78rem;color:var(--muted);padding:0 1.25rem;max-width:700px;margin:0 auto}
main{max-width:700px;margin:0 auto;padding:0.85rem 1.25rem 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.75rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1rem;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;gap:0.4rem}
.card:hover{border-color:var(--primary);transform:translateY(-2px)}
.card:active{transform:scale(0.98)}
.card-title{font-weight:600;font-size:0.9rem;line-height:1.3}
.card-meta{display:flex;flex-wrap:wrap;gap:0.35rem}
.badge{font-size:0.68rem;padding:0.12rem 0.5rem;border-radius:99px;font-weight:500}
.badge-cat{background:rgba(163,230,53,0.12);color:var(--primary)}
.badge-diff-P{background:rgba(52,211,153,0.12);color:var(--emerald)}
.badge-diff-I{background:rgba(251,191,36,0.12);color:var(--amber)}
.badge-diff-A{background:rgba(251,113,133,0.12);color:var(--rose)}
.card-muscles{font-size:0.75rem;color:var(--muted);line-height:1.4}
.card-desc{font-size:0.8rem;color:#a1a1aa;line-height:1.5;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:3rem;color:var(--muted)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  z-index:50;display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:1rem;
  max-width:560px;width:100%;padding:1.5rem;position:relative;margin:auto}
.modal-close{position:absolute;top:0.85rem;right:0.85rem;width:32px;height:32px;border-radius:8px;
  background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--muted)}
.modal-close:hover{color:var(--fg)}
.modal h2{font-family:var(--display);font-size:1.3rem;font-weight:600;margin-bottom:0.5rem;padding-right:2rem}
.modal-meta{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1.1rem}
.section{margin-bottom:1.1rem}
.section h3{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--primary);
  margin-bottom:0.4rem;font-weight:600}
.section p{font-size:0.88rem;color:#d4d4d8;line-height:1.6}
.mistakes{list-style:none;display:flex;flex-direction:column;gap:0.35rem}
.mistakes li{font-size:0.86rem;color:#d4d4d8;padding-left:1.2rem;position:relative}
.mistakes li::before{content:"⚠";position:absolute;left:0;color:var(--amber)}
.muscle-tags{display:flex;flex-wrap:wrap;gap:0.35rem}
.muscle-tags span{font-size:0.76rem;padding:0.22rem 0.65rem;border-radius:99px;
  background:rgba(255,255,255,0.06);color:#d4d4d8}
.info-row{display:flex;gap:0.5rem;font-size:0.84rem;color:var(--muted);margin-bottom:0.25rem}
.info-row strong{color:#d4d4d8;font-weight:500;min-width:88px}
.video-link{display:inline-flex;align-items:center;gap:0.4rem;color:var(--primary);
  font-size:0.84rem;text-decoration:none;margin-top:0.4rem}
.video-link:hover{text-decoration:underline}
.note{margin-top:1.25rem;padding:0.8rem;border-radius:0.6rem;background:rgba(163,230,53,0.06);
  border:1px solid rgba(163,230,53,0.2);font-size:0.78rem;color:var(--muted);line-height:1.5}
footer{max-width:700px;margin:0 auto;padding:0.5rem 1.25rem 2rem;text-align:center;color:#52525b;font-size:0.72rem}
</style>
</head>

ption":"Trazione su anelli con presa libera: gran dorsale e bicipite brachiale in trazione con instabilità che recluta i stabilizzatori.","setup_instructions":"Appendi agli anelli in presa neutra o prona, attiva le scapole ed esegui la trazione portando il petto verso gli anelli, controlla la discesa.","common_mistakes":["Anelli che oscillano","Non attivare le scapole","Gomiti che si aprono troppo"],"image_url":"","demo_video_url":""},{"name":"Trazioni negative (Negative pull-up)","macro_category":"Calisthenics","subcategory":"Pull","difficulty":"Principiante","muscle_groups":["Gran dorsale","Bicipite brachiale","Gran rotondo","Romboidi","Bicipite femorale"],"equipment":"Sbarra da trazioni","description":"Fase eccentrica di trazione alla sbarra: gran dorsale e bicipite brachiale controllano la discesa in 4-6 secondi.","setup_instructions":"Posizionati con il mento sopra la sbarra (aiutati con uno scalino o salto), poi scendi lentamente controllando l'eccentrica fino alla sospensione completa.","common_mistakes":["Cadere troppo velocemente","Spalle non attive nella discesa","Non raggiungere la sospensione completa in fondo"],"image_url":"","demo_video_url":""},{"name":"Trazioni con salto (Jumping pull-up)","macro_category":"Calisthenics","subcategory":"Pull","difficulty":"Principiante","muscle_groups":["Gran dorsale","Bicipite brachiale","Gran rotondo","Deltoide posteriore"],"equipment":"Sbarra da trazioni","description":"Trazione assistita dallo slancio delle gambe: gran dorsale e bicipite brachiale concludono la fase concentrica sopra la sbarra.","setup_instructions":"Posizionati sotto la sbarra, spingi con le gambe per aiutare la salita, poi controlla la discesa concentrandoti sul lavoro dorsale.","common_mistakes":["Spingere troppo con le gambe annullando il lavoro","Non controllare la fase eccentrica","Non attivare le scapole"],"image_url":"","demo_video_url":""},{"name":"Trazioni scapolari (Scapular pull-up)","macro_category":"Calisthenics","subcategory":"Pull","difficulty":"Principiante","muscle_groups":["Gran dorsale","Trapezio inferiore","Romboide","Gran dentato"],"equipment":"Sbarra da trazioni","description":"Retrazione e depressione scapolare in sospensione: attiva gran dorsale e trapezio inferiore senza flettere i gomiti.","setup_instructions":"In sospensione attiva, retrai le scapole verso il basso e verso l'interno sollevando il corpo di pochi cm senza piegare i gomiti, poi torna giù.","common_mistakes":["Flettere i gomiti","Non distinguere retrazione da depressione","Lasciarsi cadere senza controllo"],"image_url":"","demo_video_url":""},{"name":"Sospensione attiva (Active hang)","macro_category":"Calisthenics","subcategory":"Pull","difficulty":"Principiante","muscle_groups":["Gran dorsale","Trapezio inferiore","Gran dentato","Romboide"],"equipment":"Sbarra da trazioni","description":"Isometria in sospensione con scapole depresse e retratte: attiva gran dorsale, trapezio inferiore e gran dentato.","setup_instructions":"Appendi alla sbarra, attiva le scapole portandole in depressione e retrazione, spingi le spalle lontano dalle orecchie e mantieni.","common_mistakes":["Spalle alle orecchie (sospensione passiva)","Mancanza di attivazione dorsale","Iperestensione lombare"],"image_url":"","demo_video_url":""},{"name":"Sospensione passiva (Dead hang)","macro_category":"Calisthenics","subcategory":"Pull","difficulty":"Principiante","muscle_groups":["Gran dorsale","Cuffia dei rotatori","Avambraccio"],"equipment":"Sbarra da trazioni","description":"Sospensione rilassata alla sbarra per decompressione e mobilità di spalla: allunga gran dorsale e capsula articolare.","setup_instructions":"Appendi alla sbarra in presa prona a braccia tese, lascia le spalle rilassate vicino alle orecchie e mantieni la posizione.","common_mistakes":["Trattenere il respiro","Tensione eccessiva nelle spalle","Durata troppo breve per avere beneficio"],"image_url":"","demo_video_url":""},{"name":"Sospensione in flessione (Flexed hang)","macro_category":"Calisthenics","subcategory":"Pull","difficulty":"Principiante","muscle_groups":["Gran dorsale","Bicipite brachiale","Gran rotondo","Romboide"],"equipment":"Sbarra da trazioni","description":"Isometria con mento sopra la sbarra: gran dorsale e bicipite brachiale mantengono la flessione di gomito e adduzione di spalla.","setup_instructions":"Porta il mento sopra la sbarra (aiutandoti se necessario) e mantieni la posizione isometrica con gomiti flessi e scapole retratte.","common_mistakes":["Spingere il mento in avanti compensando","Perdere la retrazione scapolare","Respirazione bloccata"],"image_url":"","demo_video_url":""},{"name":"Trazioni typewriter (Typewriter pull-up)","macro_category":"Calisthenics","subcategory":"Pull","difficulty":"Avanzato","muscle_groups":["Gran dorsale","Gran rotondo","Bicipite brachiale","Deltoide posteriore","Gran dentato"],"equipment":"Sbarra da trazioni","description":"Trazione con spostamento laterale del corpo: gran dorsale e gran rotondo lavorano in modo unilaterale alternato sopra la sbarra.","setup_instructions":"Esegui una trazione completa, poi sposta il corpo lateralmente da un lato all'altro sopra la sbarra mantenendo i gomiti flessi.","common_mistakes":["Perdere quota scendendo durante lo spostamento","Ruotare il busto","Non controllare la discesa"],"image_url":"","demo_video_url":""},{"name":"Piegamenti al muro (Wall push-up)","macro_category":"Calisthenics","subcategory":"Push","difficulty":"Principiante","muscle_groups":["Gran pettorale","Deltoide anteriore","Tricipite brachiale","Gran dentato"],"equipment":"Muro","description":"Piegamenti in piedi contro il muro: gran pettorale, deltoide anteriore e tricipite brachiale in spinta ridotta.","setup_instructions":"Posizionati di fronte al muro con le mani all'altezza delle spalle, fletti i gomiti avvicinando il petto al muro poi spingi indietro.","common_mistakes":["Flettere solo la testa verso il muro","Gomiti troppo aperti","Non attivare il core"],"image_url":"","demo_video_url":""},{"name":"Piegamenti sulle ginocchia (Knee push-up)","macro_category":"Calisthenics","subcategory":"Push","difficulty":"Principiante","muscle_groups":["Gran pettorale","Deltoide anteriore","Tricipite brachiale","Gran dentato"],"equipment":"Nessuno","description":"Piegamenti con appoggio sulle ginocchia: gran pettorale, deltoide anteriore e tricipite brachiale in spinta con leva ridotta.","setup_instructions":"In posizione di plank con ginocchia a terra, mantieni il corpo dritto dalle ginocchia alla testa, fletti i gomiti fino a sfiorare il suolo e spingi su.","common_mistakes":["Flettere l'anca invece di mantenere l'allineamento","Non scendere abbastanza","Gomiti aperti a 90°"],"image_url":"","demo_video_url":""},{"name":"Piegamenti a pike (Pike push-up)","macro_category":"Calisthenics","subcategory":"Push","difficulty":"Intermedio","muscle_groups":["Deltoide anteriore","Gran pettorale (fascio clavicolare)","Tricipite brachiale","Gran dentato"],"equipment":"Nessuno","description":"Piegamenti in posizione a V invertita: deltoide anteriore e gran pettorale clavicolare in spinta verticale, propedeutico al handstand push-up.","setup_instructions":"Parti in posizione di downward dog con i fianchi alti, fletti i gomiti portando la testa verso il suolo davanti alle mani e spingi indietro.","common_mistakes":["Flettere in avanti invece che in verticale","Fianchi troppo bassi","Carico sul collo invece che sulle spalle"],"image_url":"","demo_video_url":""},{"name":"Piegamenti pseudo planche (Pseudo planche push-up)","macro_category":"Calisthenics","subcategory":"Push","difficulty":"Intermedio","muscle_groups":["Deltoide anteriore","Gran pettorale","Tricipite brachiale","Gran dentato"],"equipment":"Nessuno","description":"Piegamenti con mani avanzate verso i fianchi: deltoide anteriore e gran pettorale in spinta con il baricentro spostato in avanti.","setup_instructions":"Posiziona le mani più avanti rispetto alle spalle verso i fianchi, inclina il corpo in ava tico alla leg raise.","setup_instructions":"Appendi alla sbarra, fletti le anche portando le ginocchia al petto controllando la salita e la discesa senza dondolare.","common_mistakes":["Dondolare con il bacino","Usare troppo lo slancio","Non raggiungere l'altezza delle anche"],"image_url":"","demo_video_url":""},{"name":"Compressione addominale (Compression work)","macro_category":"Calisthenics","subcategory":"Core","difficulty":"Intermedio","muscle_groups":["Ileopsoas","Retto addominale","Gran dentato"],"equipment":"Nessuno","description":"Esercizio di flessione di anca e compressione: ileopsoas e retto addominale avvicinano le cosce al petto da seduti.","setup_instructions":"Seduto a terra con le mani dietro, solleva le gambe tese avvicinandole al petto e mantieni la schiena dritta, poi torna giù controllato.","common_mistakes":["Curvare la schiena indietro","Flettere le ginocchia","Perdere la compressione"],"image_url":"","demo_video_url":""},{"name":"Pullover alla sbarra (Pullover)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Intermedio","muscle_groups":["Gran dorsale","Retto addominale","Bicipite brachiale","Gran dentato"],"equipment":"Sbarra da trazioni","description":"Trazione con rotazione sopra la sbarra: gran dorsale e retto addominale portano il corpo oltre la sbarra fino al supporto.","setup_instructions":"Esegui una trazione portando il mento sopra la sbarra, poi continua la rotazione indietro spingendo con il core fino a girare sopra la sbarra in supporto.","common_mistakes":["Non completare la rotazione","Usare troppo slancio","Non attivare il core nella fase di passaggio"],"image_url":"","demo_video_url":""},{"name":"Leva sui gomiti (Elbow lever)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Avanzato","muscle_groups":["Gran dorsale","Retto addominale","Deltoide","Gran dentato"],"equipment":"Nessuno","description":"Equilibrio orizzontale in appoggio sui gomiti sull'addome: gran dorsale e core bilanciano nics","subcategory":"Skills","difficulty":"Avanzato","muscle_groups":["Gran dorsale","Deltoide posteriore","Gran rotondo","Bicipite brachiale"],"equipment":"Sbarra da trazioni","description":"Isometria orizzontale prona in tuck: gran dorsale e deltoide posteriore mantengono il corpo parallelo con ginocchia al petto.","setup_instructions":"Dalla sospensione, gira in skin the cat fino a posizione prona, porta le ginocchia al petto e solleva il bacino fino al corpo orizzontale in tuck.","common_mistakes":["Fianchi troppo bassi","Non completare la rotazione prona","Perdere l'orizzontalità"],"image_url":"","demo_video_url":""},{"name":"Verticale sulla testa (Headstand)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Intermedio","muscle_groups":["Deltoide","Trapezio","Retto addominale","Gran dentato"],"equipment":"Nessuno","description":"Equilibrio invertito con appoggio sulla testa e mani a triangolo: deltoide e trapezio stabilizzano, propedeutico all'handstand.","setup_instructions":"Forma un triangolo con le mani e la testa a terra, appoggia la nuca sulle mani, solleva le ginocchia sulle braccia poi stendi le gambe in verticale.","common_mistakes":["Carico eccessivo sul collo","Non usare le mani per bilanciare","Arco lombare"],"image_url":"","demo_video_url":""},{"name":"Pelle di gatto (Skin the cat)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Avanzato","muscle_groups":["Gran dorsale","Deltoide","Bicipite brachiale","Retto addominale"],"equipment":"Anelli o sbarra bassa","description":"Rotazione completa in sospensione passando per la german hang: gran dorsale e deltoide lavorano in escursione completa.","setup_instructions":"Appendi, solleva le gambe e ruota indietro passando sotto la sbarra fino alla sospensione prona (german hang), poi torna indietro controllato.","common_mistakes":["Lasciarsi cadere nella fase bassa","Non controllare il ritorno","Braccia non tese"],"image_url":"","demo_video_url":""},{"name":"Sospensi tion":"Trazione e spinta. Coinvolge gran dorsale, grande pettorale, deltoidi e tricipiti. Transizione dinamica dalla fase di trazione alla spinta sopra la sbarra.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Squat a corpo libero (Air squat)","macro_category":"Calisthenics","subcategory":"Legs","difficulty":"Principiante","muscle_groups":["Quadricipiti","Glutei","Femorali"],"equipment":"Nessuno","description":"Flessione di anche, ginocchia e caviglie. Coinvolge quadricipiti, grande gluteo ed erettori spinali. Mantenere la colonna in posizione neutra e il peso distribuito sull'intera pianta del piede.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Affondi (Lunge)","macro_category":"Calisthenics","subcategory":"Legs","difficulty":"Principiante","muscle_groups":["Quadricipiti","Glutei","Femorali"],"equipment":"Nessuno","description":"Movimento di estensione/flessione di ginocchio e anca. Coinvolge quadricipite, grande gluteo e ischiocrurali. Mantenere il busto verticale e il ginocchio in linea con la caviglia senza eccedere nell'avanzamento.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Affondi bulgari (Bulgarian split squat)","macro_category":"Calisthenics","subcategory":"Legs","difficulty":"Intermedio","muscle_groups":["Quadricipiti","Glutei","Femorali"],"equipment":"Piano rialzato","description":"Squat unilaterale con arto posteriore sollevato. Attiva quadricipite e grande gluteo. Mantenere l'equilibrio e la verticale, assicurando che il ginocchio dell'arto a terra non superi eccessivamente la punta.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Pistol squat (Squat monopodalico)","macro_category":"Calisthenics","subcategory":"Legs","difficulty":"Avanzato","muscle_groups":["Quadricipiti","Glutei","Core"],"equipment":"Nessuno","description":"Estensione arto inferiore. Coinvolge quadricipite, glutei, addominali. Mantieni l'equilibrio con la gamba tesa in avanti e il piede sollevato dal suolo.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Shrimp squat (Squat gambo piegato)","macro_category":"Calisthenics","subcategory":"Legs","difficulty":"Avanzato","muscle_groups":["Quadricipiti","Glutei","Core"],"equipment":"Nessuno","description":"Estensione arto inferiore. Coinvolge quadricipite, gluteo. Scendi portando un ginocchio a sfiorare il suolo mentre l'altro arto resta in appoggio.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Calf raise (Sollevamento sui polpacci)","macro_category":"Calisthenics","subcategory":"Legs","difficulty":"Principiante","muscle_groups":["Polpacci"],"equipment":"Gradino","description":"Flessione plantare della caviglia. Coinvolge tricipite surale (gastrocnemio e soleo). Eseguire il movimento in pieno range di movimento, con pausa di picco nella fase di contrazione massima.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Jump squat (Squat con salto)","macro_category":"Calisthenics","subcategory":"Legs","difficulty":"Intermedio","muscle_groups":["Quadricipiti","Glutei","Polpacci"],"equipment":"Nessuno","description":"Spinta esplosiva. Coinvolge quadricipite, grande gluteo e tricipite surale. Atterrare in modo controllato, assorbendo l'impatto con la flessione immediata delle ginocchia.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Plank (Tavola)","macro_category":"Calisthenics","subcategory":"Core","difficulty":"Principiante","muscle_groups":["Core","Spalle"],"equipment":"Nessuno","description":"Isometria core. Coinvolge retto addominale, obliqui, trasverso. Mantieni allineamento neutro di colonna e bacino, evitando la caduta del tratto lombare.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Side plank (Tavola laterale)","macro_category":"Calisthenics","subcategory":"Core","difficulty":"Intermedio","muscle_groups":["Obliqui","Core"],"equipment":"Nessuno","description":"Isometria laterale. Coinvolge obliquo interno/esterno, quadrato dei lombi. Mantieni il corpo in linea retta tra testa, bacino e piedi.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Hanging leg raise (Sollevamento gambe alla sbarra)","macro_category":"Calisthenics","subcategory":"Core","difficulty":"Intermedio","muscle_groups":["Addome","Flessori anca"],"equipment":"Sbarra","description":"Flessione addominale. Coinvolge retto addominale. Tecnica: stabilizzare il bacino evitando l'eccessiva oscillazione nel sollevamento degli arti.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"L-sit (Posa a L)","macro_category":"Calisthenics","subcategory":"Core","difficulty":"Avanzato","muscle_groups":["Core","Flessori anca","Tricipiti"],"equipment":"Parallele","description":"Isometrica di flessione dell'anca. Coinvolge retto addominale, ileopsoas e tricipiti. Mantenere le braccia tese e il bacino in retroversione per sollevare gli arti.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Hollow hold (Posa concava)","macro_category":"Calisthenics","subcategory":"Core","difficulty":"Intermedio","muscle_groups":["Core"],"equipment":"Nessuno","description":"Isometria core. Coinvolge retto addominale. Tecnica: schiena completamente a contatto col suolo, spalle e gambe sollevate in forma a barchetta.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Dragon flag (Bandiera di Bruce Lee)","macro_category":"Calisthenics","subcategory":"Core","difficulty":"Avanzato","muscle_groups":["Core","Dorsali"],"equipment":"Piano","description":"Isometria/trazione core. Coinvolge retto addominale, flessori anca e dorsali. Tecnica: mantenere corpo allineato, evitare iperestensione lombare.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Ab wheel rollout (Ruota addominale)","macro_category":"Calisthenics","subcategory":"Core","difficulty":"Avanzato","muscle_groups":["Core","Dorsali"],"equipment":"Ab wheel","description":"Esercizio di anti-estensione per il retto addominale e i muscoli profondi del core. Eseguire il movimento di estensione controllando il bacino in retroversione per evitare l'iperlordosi lombare.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Handstand (Verticale)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Avanzato","muscle_groups":["Spalle","Core","Tricipiti"],"equipment":"Muro (opz.)","description":"Isometria verticale. Coinvolge deltoidi, tricipiti e core. Tecnica: allineamento totale polso-spalla-anca-tallone, addome e glutei attivamente contratti.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Front lever (Leva frontale)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Avanzato","muscle_groups":["Dorsali","Core","Bicipiti"],"equipment":"Sbarra","description":"Isometria di trazione. Coinvolge gran dorsale, bicipiti e core. Tecnica: bacino in retroversione, scapole in depressione e braccia perfettamente tese.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Back lever (Leva posteriore)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Avanzato","muscle_groups":["Dorsali","Petto","Bicipiti"],"equipment":"Sbarra","description":"Isometria di estensione di spalla. Coinvolge gran dorsale, grande pettorale e core. Richiede massima retroversione pelvica e tenuta scapolare per mantenere il corpo in posizione orizzontale.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Planche (Planata)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Avanzato","muscle_groups":["Spalle","Petto","Core"],"equipment":"Parallele","description":"Isometria di spinta. Coinvolge gran pettorale, deltoide, core. Sporgiti in avanti con le spalle per aumentare il braccio di leva sul gran pettorale.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Human flag (Bandiera umana)","macro_category":"Calisthenics","subcategory":"Skills","difficulty":"Avanzato","muscle_groups":["Obliqui","Spalle","Dorsali"],"equipment":"Palo verticale","description":"Isometrica di trazione. Coinvolge gran dorsale, obliquo esterno e deltoidi. Richiede massima tensione in tutto il corpo per mantenere l'allineamento orizzontale del tronco.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Burpee","macro_category":"Corpo Libero","subcategory":"Full body","difficulty":"Intermedio","muscle_groups":["Petto","Gambe","Core"],"equipment":"Nessuno","description":"Movimento metabolico completo: squat, push-up e salto. Coinvolge tutto il corpo. Mantenere il core compatto durante il passaggio dalla posizione di plank a quella eretta per proteggere la colonna.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Mountain climber (Salita del montanaro)","macro_category":"Corpo Libero","subcategory":"Cardio","difficulty":"Principiante","muscle_groups":["Core","Spalle","Quadricipiti"],"equipment":"Nessuno","description":"Flessione alternata delle anche. Coinvolge retto addominale e flessori dell'anca. Mantenere la posizione di plank con scapole neutre durante l'esecuzione.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Jumping jack (Saltelli a stella)","macro_category":"Corpo Libero","subcategory":"Cardio","difficulty":"Principiante","muscle_groups":["Gambe","Spalle"],"equipment":"Nessuno","description":"Abduzione e adduzione di arti. Coinvolge deltoidi, grande gluteo e adduttori. Mantenere un ritmo costante coordinando il salto con il movimento semicircolare delle braccia.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Squat jump (Squat con salto)","macro_category":"Corpo Libero","subcategory":"Plyo","difficulty":"Intermedio","muscle_groups":["Quadricipiti","Glutei","Polpacci"],"equipment":"Nessuno","description":"Squat con fase concentrica esplosiva e salto. Coinvolge quadricipiti, glutei e tricipite surale. Atterrare in modo controllato, assorbendo l'impatto con la flessione di caviglia, ginocchio e anca.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Tuck jump (Salto a ginocchia al petto)","macro_category":"Corpo Libero","subcategory":"Plyo","difficulty":"Intermedio","muscle_groups":["Quadricipiti","Polpacci","Core"],"equipment":"Nessuno","description":"Salto esplosivo. Coinvolge quadricipiti, glutei e addominali. Richiede una forte contrazione del core per portare le ginocchia al petto durante la fase aerea.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Skater jump (Salti laterali)","macro_category":"Corpo Libero","subcategory":"Plyo","difficulty":"Intermedio","muscle_groups":["Glutei","Quadricipiti","Polpacci"],"equipment":"Nessuno","description":"Estensione unilaterale dinamica. Coinvolge gluteo medio, quadricipite. Salta lateralmente atterrando in modo controllato su una gamba per stabilizzare il carico.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Bear crawl (Camminata dell'orso)","macro_category":"Corpo Libero","subcategory":"Full body","difficulty":"Intermedio","muscle_groups":["Core","Spalle","Quadricipiti"],"equipment":"Nessuno","description":"Locomozione in quadrupedia. Coinvolge catena cinetica crociata, deltoidi, core e quadricipiti. Mantenere la colonna neutra e coordinare il movimento controlaterale di braccia e gambe.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Crab walk (Camminata del granchio)","macro_category":"Corpo Libero","subcategory":"Full body","difficulty":"Principiante","muscle_groups":["Core","Spalle","Femorali"],"equipment":"Nessuno","description":"Locomozione in inversione. Coinvolge deltoidi, pettorali e core. Mantenere il bacino alto e il petto aperto, coordinando i movimenti di spinta degli arti per avanzare in sicurezza.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Inchworm (Bruco)","macro_category":"Corpo Libero","subcategory":"Full body","difficulty":"Intermedio","muscle_groups":["Core","Spalle","Femorali"],"equipment":"Nessuno","description":"Flessione ed estensione del tronco. Coinvolge retto addominale, spalle e catena posteriore. Mantenere le gambe tese durante la camminata manuale verso la posizione di plank.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"High knees (Ginocchia alte)","macro_category":"Corpo Libero","subcategory":"Cardio","difficulty":"Principiante","muscle_groups":["Quadricipiti","Polpacci","Core"],"equipment":"Nessuno","description":"Cardio dinamico. Coinvolge flessori anca, quadricipiti e core. Tecnica: corsa sul posto con ginocchia alte, mantenere busto eretto e sguardo avanti.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Butt kicks (Calci ai glutei)","macro_category":"Corpo Libero","subcategory":"Cardio","difficulty":"Principiante","muscle_groups":["Femorali","Polpacci"],"equipment":"Nessuno","description":"Flessione attiva del ginocchio in corsa. Coinvolge bicipite femorale e ischiocrurali. Mantenere il busto dritto e un ritmo costante, cercando la massima escursione articolare al tallone.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""},{"name":"Plank to pushup (Tavola a piegamento)","macro_category":"Corpo Libero","subcategory":"Core","difficulty":"Intermedio","muscle_groups":["Core","Petto","Tricipiti"],"equipment":"Nessuno","description":"Transizione tra isometria e spinta. Coinvolge retto addominale, pettorali, tricipiti. Mantieni il bacino fermo durante il passaggio da appoggio sui gomiti a mani.","setup_instructions":"","common_mistakes":[],"image_url":"","demo_video_url":""}];
const CATS = ["Corpo Libero","Calisthenics","Body Building"];
const diffClass = d => d==="Principiante"?"P":d==="Intermedio"?"I":"A";
const state = {cat:"",search:"",diff:"",muscle:""};
const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = '<button class="tab active" data-cat="">Tutti <span class="count">'+EXERCISES.length+'</span></button>'+CATS.map(c=>{const n=EXERCISES.filter(e=>e.macro_category===c).length;return '<button class="tab" data-cat="'+c+'">'+c+' <span class="count">'+n+'</span></button>';}).join("");
tabsEl.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tabsEl.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");state.cat=t.dataset.cat;render();});
const muscles=[...new Set(EXERCISES.flatMap(e=>e.muscle_groups))].sort();
const muscleSel=document.getElementById("muscleFilter");
muscles.forEach(m=>{const o=document.createElement("option");o.value=m;o.textContent=m;muscleSel.appendChild(o);});
document.getElementById("search").oninput=e=>{state.search=e.target.value.toLowerCase();render();};
document.getElementById("diffFilter").onchange=e=>{state.diff=e.target.value;render();};
muscleSel.onchange=e=>{state.muscle=e.target.value;render();};
function filtered(){return EXERCISES.filter(e=>{if(state.cat&&e.macro_category!==state.cat)return false;if(state.diff&&e.difficulty!==state.diff)return false;if(state.muscle&&!e.muscle_groups.includes(state.muscle))return false;if(state.search){const blob=(e.name+" "+e.muscle_groups.join(" ")+" "+e.equipment+" "+e.subcategory+" "+e.description).toLowerCase();if(!blob.includes(state.search))return false;}return true;});}
function render(){const list=filtered();document.getElementById("count").textContent=list.length+" esercizi";const grid=document.getElementById("grid");if(!list.length){grid.innerHTML='<div class="empty">Nessun esercizio trovato.</div>';return;}grid.innerHTML=list.map((e,i)=>'<div class="card" data-i="'+i+'"><div class="card-title">'+esc(e.name)+'</div><div class="card-meta"><span class="badge badge-cat">'+e.macro_category+'</span><span class="badge badge-diff-'+diffClass(e.difficulty)+'">'+e.difficulty+'</span></div><div class="card-muscles">'+e.muscle_groups.join(" · ")+'</div><div class="card-desc">'+esc(e.description)+'</div></div>').join("");grid.querySelectorAll(".card").forEach(c=>c.onclick=()=>openDetail(list[+c.dataset.i]));}
function openDetail(e){const m=document.getElementById("modal"),ov=document.getElementById("overlay");let h='<button class="modal-close" onclick="closeDetail()">✕</button><h2>'+esc(e.name)+'</h2><div class="modal-meta"><span class="badge badge-cat">'+e.macro_category+'</span><span class="badge badge-diff-'+diffClass(e.difficulty)+'">'+e.difficulty+'</span>'+(e.subcategory?'<span class="badge" style="background:rgba(255,255,255,0.06);color:#d4d4d8">'+esc(e.subcategory)+'</span>':'')+'</div>';if(e.description)h+='<div class="section"><h3>Descrizione</h3><p>'+esc(e.description)+'</p></div>';if(e.muscle_groups.length)h+='<div class="section"><h3>Gruppi muscolari</h3><div class="muscle-tags">'+e.muscle_groups.map(m=>'<span>'+esc(m)+'</span>').join("")+'</div></div>';h+='<div class="section"><h3>Dettagli</h3><div class="info-row"><strong>Attrezzatura</strong>'+esc(e.equipment||"—")+'</div><div class="info-row"><strong>Sottocategoria</strong>'+esc(e.subcategory||"—")+'</div><div class="info-row"><strong>Difficoltà</strong>'+esc(e.difficulty)+'</div></div>';if(e.setup_instructions)h+='<div class="section"><h3>Setup</h3><p>'+esc(e.setup_instructions)+'</p></div>';if(e.common_mistakes.length)h+='<div class="section"><h3>Errori comuni</h3><ul class="mistakes">'+e.common_mistakes.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul></div>';if(e.demo_video_url)h+='<a class="video-link" href="'+esc(e.demo_video_url)+'" target="_blank">▶ Video</a>';h+='<div class="note">Demo offline — l'analisi biomeccanica con IA richiede la versione online.</div>';m.innerHTML=h;ov.classList.add("open");}
function closeDetail(){document.getElementById("overlay").classList.remove("open");}
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeDetail();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
