org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
org.gradle.java.toolchain=remote

# =============================================================================
# R8 Ottimizzazioni Avanzate per moVeerAI
# Versione 1.7+ con ARCore, RevenueCat, e WebP
# =============================================================================

# Abilita R8 come osiatore predefinito (prosegui con ProGuard)
android.enableR8=true

# Abilita ottimizzazioni R8 aggressive
android.optimizeR8=true

# Abilita D8 hybrid dexing per method count management
android.enableD8HybridDexing=true

# Abilita incremental desugaring per Java 8+ features
android.enableIncrementalDesugaring=true

# Abilita resource processing per shrink resources
android.enableResourceProcessing=true

# Riduci la dimensione dell'app abbandonando le risorse non utilizzate
android.resources.shrink=true

# Strip tutte le informazioni di debug dalle release
android.debuggable=false

# Usa AAPT2 per migliorare il processing delle risorse
android.enableAapt2=true

# Abilita R8 full mode per migliori ottimizzazioni
android.enableR8.fullMode=true

# Abilita caching per build più veloci
org.gradle.caching=true

# Abilita compilazione parallela
org.gradle.parallel=true

# Usa Daemon per build più rapide
org.gradle.daemon=true

# Configura memoria per build grandi
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
